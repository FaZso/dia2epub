# Place as /etc/nginx/sites-available/dia2epub
# Then: ln -s /etc/nginx/sites-available/dia2epub /etc/nginx/sites-enabled/
# Replace YOUR_DOMAIN with the real hostname before enabling TLS.

upstream dia2epub_app {
    server 127.0.0.1:8765;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # After certbot, this block is typically redirected to HTTPS automatically.
    location / {
        proxy_pass http://dia2epub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # EPUB downloads can be several MB; conversion can take minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 2m;
    }
}
